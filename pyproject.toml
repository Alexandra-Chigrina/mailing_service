[tool.poetry]
name = "mailing-service"
version = "0.1.0"
description = ""
authors = ["Alexandra <a.chigrina89@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.3"
python-dotenv = "^1.1.0"
psycopg2-binary = "^2.9.10"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.16.1"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '.venv'

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = ["tests.*"]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119
multi_line_output = 3

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
