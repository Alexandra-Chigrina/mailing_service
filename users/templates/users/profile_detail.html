{% extends 'mailing/base.html' %}
{% load mailing_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Профиль пользователя</h1>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9 col-sm-12">
            <div class="card mb-4 box-shadow">
                {% if user.avatar %}
                    <img src="{{ user.avatar | media_filter }}">
                {% endif %}
                <div class="card-body">
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li><strong>Email:</strong> {{ user.email }}</li>
                        <li><strong>Номер телефона:</strong> {{ user.phone_number }}</li>
                        <li><strong>Страна:</strong> {{ user.country }}</li>
                    </ul>
                    <a class="btn btn-lg btn-block btn-outline-primary"
                       href="{% url 'users:profile_edit' %}"
                        role="button">
                        Редактировать
                    </a>
                    <a class="btn btn-lg btn-block btn-outline-primary"
                       href="{% url 'mailing:home' %}"
                        role="button">
                        На главную
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
