{% extends 'mailing/base.html' %}
{% load mailing_tags %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header">
            <h2 class="mb-0">{{ client.full_name }}</h2>
        </div>
        <div class="card-body">
            <p><strong>Email:</strong> {{ client.email }}</p>
            <p><strong>Комментарий:</strong> {{ client.comment }}</p>
            {% if user == client.owner %}
                <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-outline-primary mt-3">Редактировать</a>
                <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-outline-primary mt-3">Удалить</a>
            {% endif %}
            <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-primary mt-3">Назад к списку</a>
        </div>
    </div>
</div>
{% endblock %}
