{% extends 'mailing/base.html' %}
{% load mailing_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удалить рассылку №{{ mailing.id }}</h1>
</div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-9 col-sm-12">
            <div class="card mb-4 box-shadow">
                <div class="card-body">
                    <p class="card-text">Вы действительно хотите удалить рассылку от {{ object.start_time|date:"d.m.Y H:i" }} - '{{ object.message.subject }}'?</p>
                    <form method="post" action="" class="form-floating">
                        {% csrf_token %}

                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                            Удалить
                        </button>
                        <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'mailing:mailing_detail' mailing.pk %}" role="button">Отменить</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
